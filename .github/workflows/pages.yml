name: Deploy book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "bxsites.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BoxLang and BxSites
        uses: ortus-boxlang/setup-boxlang@1.4.0
        with:
          modules: bx-sites bx-markdown bx-esapi bx-yaml bx-image

      - name: Set production base URL
        run: |
          sed -i 's#^baseURL: .*#baseURL: "https://jbeers.github.io/asteroids-training-manual/"#' bxsites.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build book
        run: |
          boxlang bxSites build
          test -s site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
